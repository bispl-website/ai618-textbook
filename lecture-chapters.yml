      - chapters/ch10.qmd
    note: >-
      Accelerated Posterior Sampling and Classifier-Free Guidance, slides
      114-131. The opening recap, slides 114-116, recapitulates lecture 09, and
      the instructor asked on 2026-10-31 that it be folded into chapter 10
      rather than developed again here.
