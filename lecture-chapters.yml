      - chapters/ch08.qmd
    note: >-
      Score-SDE Formulation. The lecture opens with the DDIM construction
      (slides 17-25), but DDIM is defined in DDPM's terms, so the instructor
      decided on 2026-10-16 that it lives in chapter 6 next to DDPM; chapter 6
      therefore draws on two lectures' notes. Slides 43-54 of this lecture were
      run again at the start of lecture 08 and are chapter 8.
  "08":
    chapter: chapters/ch09.qmd
    also:
      - chapters/ch08.qmd
    note: >-
      Conditional Diffusion Models, slides 55-72. The first lecture whose
      chapter number is not its own. Chapter 8, *Why Diffusion Models*, is not
      a lecture chapter: it is slides 39-55, which lectures 07 and 08 both ran
      through, merged from both lectures' notes and split out on 2026-10-25.
  "09":
    chapter: chapters/ch10.qmd
    note: >-
      Diffusion Models for Inverse Problems, slides 73-116. Published as
      chapter 10. This is the mapping `promote.py --lecture 10` used to get
      wrong, from the other side.
  "10":
