name: build book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref, so a pull request build cancels only its own earlier build. The
# single `pages` group this used to have meant any pull request push cancelled
# an in-flight deployment of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      # Both formats, always. The PDF build is the one that catches raw HTML,
      # SVG figures and non-ASCII text; building only HTML hides them until
      # someone tries to print the book.
      #
      # One render, not one per format. `_quarto.yml` declares html and pdf, and
      # `quarto render` produces both into _book/ together. Rendering a single
      # format at a time clears the output directory first, so `--to html`
      # followed by `--to pdf` leaves _book/ holding the PDF and no index.html,
      # and Pages serves a 404 from a green build.
      - run: quarto render
      - name: check the book actually built
        run: |
          test -f _book/index.html || { echo "::error::_book/index.html missing"; ls -R _book; exit 1; }
          find _book -name '*.pdf' | grep -q . || { echo "::error::no PDF in _book"; exit 1; }
          echo "html pages: $(find _book -name '*.html' | wc -l)"
          du -sh _book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deployments queue rather than cancel: a half-finished Pages deploy that
    # gets killed can leave the published site on a stale commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
