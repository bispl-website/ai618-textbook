# Which chapter file each lecture's notes belong to.
#
# Chapter N is not lecture N. It was, up to lecture 08. On 2026-10-25 the
# material that lectures 07 and 08 both ran through was lifted out of chapter 7
# and given a chapter of its own, *Why Diffusion Models*, which took the number
# the removed Latent Diffusion stub had held. Everything from lecture 09 on is
# therefore one higher than its lecture number, and this file -- not the
# filename arithmetic -- is what says so.
#
# Before this file existed the mapping lived only in each chapter's provenance
# comment and in ~/ai618/chapter-pipeline/lecNN.md, so `promote.py --lecture 10`
# aimed at ch10.qmd, which is lecture 09's finished chapter. Its "already been
# worked on" guard caught it twice; the seeding step could not be used at all.
#
# Fields
#   chapter  the chapter a lecture's notes are promoted into. One per lecture.
#            This is the file `promote.py --lecture NN` writes.
#   also     further chapters that carry part of this lecture's material,
#            because the book's boundaries are not the lectures'. Reported by
#            `promote.py`, never written by it.
#   note     why this entry is not the identity, where it is not.
#
# Every entry below was checked against the chapter's own provenance comment,
# the lecture README in the scribe repository, and the chapter title.
# Verified 2026-10-31.

lectures:
  "00":
    chapter: chapters/ch00.qmd
    note: >-
      Mathematical Preliminaries. Not a scribe chapter -- the instructor wrote
      it from his own book. Unnumbered, between the preface and Part I.
  "01":
    chapter: chapters/ch01.qmd
  "02":
